<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Note App (SSO Frontend)</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- React Router (optional, for multiple pages) -->
  <script src="https://unpkg.com/history@5/umd/history.development.js"></script>
  <script src="https://unpkg.com/react-router-dom@6/umd/react-router-dom.development.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body class="bg-gray-100">
  <div id="root"></div>

  <script>
    /*************************************************************
     * CONFIG
     *************************************************************/
    const SSO = "https://sso.gaixixon.workers.dev";
    const BACKEND = "https://note-api.gaixixon.workers.dev";
    const FRONTEND = "https://gaixixon.github.io/noteapp";

    /*************************************************************
     * GLOBAL SESSION TOKEN (IN MEMORY ONLY)
     *************************************************************/
    let sessionToken = null;

    async function exchangeCodeForSessionToken(code) {
      const res = await fetch(SSO + "/exchange", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code }),
      });

      if (!res.ok) return null;
      const data = await res.json();
      sessionToken = data.sessionToken;
      return data;
    }

    async function refreshSessionToken() {
      const res = await fetch(SSO + "/refresh", {
        method: "POST",
        credentials: "include",
      });

      if (!res.ok) return null;
      const data = await res.json();
      sessionToken = data.sessionToken;
      return data;
    }

    async function getUserInfo() {
      const res = await fetch(SSO + "/userinfo", {
        credentials: "include",
      });

      if (!res.ok) return null;
      return res.json();
    }

    async function secureApi(path, method = "GET", body = null) {
      if (!sessionToken) return null;

      const res = await fetch(BACKEND + path, {
        method,
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + sessionToken,
        },
        body: body ? JSON.stringify(body) : null,
      });

      // If session expired → try refresh → retry once
      if (res.status === 401) {
        const refreshed = await refreshSessionToken();
        if (!refreshed) return null;

        return fetch(BACKEND + path, {
          method,
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + sessionToken,
          },
          body: body ? JSON.stringify(body) : null,
        }).then(x => x.json());
      }

      return res.json();
    }

    /*************************************************************
     * REACT APP
     *************************************************************/
    const e = React.createElement;

    function App() {
      const [loading, setLoading] = React.useState(true);
      const [user, setUser] = React.useState(null);
      const [notes, setNotes] = React.useState([]);
      const [newNote, setNewNote] = React.useState("");

      // On load → check URL for ?code=
      React.useEffect(() => {
        (async () => {
          const url = new URL(window.location.href);
          const code = url.searchParams.get("code");

          if (code) {
            await exchangeCodeForSessionToken(code);
            url.searchParams.delete("code");
            window.history.replaceState({}, "", url.toString());
          }

          // Try get user
          const info = await getUserInfo();
          if (info) {
            setUser(info);
            sessionToken = info.sessionToken;
          }

          setLoading(false);
        })();
      }, []);

      async function login() {
        window.location = SSO + "/login?redirect=" + encodeURIComponent(FRONTEND);
      }

      async function logout() {
        sessionToken = null;
        window.location = SSO + "/logout?redirect=" + encodeURIComponent(FRONTEND);
      }

      async function loadNotes() {
        const data = await secureApi("/notes");
        setNotes(data || []);
      }

      async function addNote() {
        if (!newNote.trim()) return;
        const data = await secureApi("/notes", "POST", { text: newNote });
        setNotes(data);
        setNewNote("");
      }

      if (loading) {
        return e("div", { className: "p-6 text-center text-gray-600" }, "Loading...");
      }

      if (!user) {
        return e("div", { className: "p-6" },
          e("button", {
            className: "px-4 py-2 bg-blue-600 text-white rounded",
            onClick: login,
          }, "Login with SSO")
        );
      }

      return e("div", { className: "max-w-xl mx-auto mt-10 bg-white p-6 rounded shadow" },
        e("h1", { className: "text-xl font-bold mb-4" }, "Welcome, " + user.name),

        e("div", { className: "flex gap-2 mb-6" },
          e("button", {
            className: "px-3 py-1 bg-gray-700 text-white rounded",
            onClick: loadNotes,
          }, "Load Notes"),

          e("button", {
            className: "px-3 py-1 bg-red-500 text-white rounded",
            onClick: logout,
          }, "Logout"),
        ),

        // Notes list
        e("ul", { className: "mb-4" },
          notes.map((n) =>
            e("li", { key: n.id, className: "border-b py-2" }, n.text)
          )
        ),

        // Add note
        e("div", { className: "flex gap-2" },
          e("input", {
            className: "flex-1 border px-2 py-1 rounded",
            value: newNote,
            onChange: (e) => setNewNote(e.target.value),
            placeholder: "New note...",
          }),
          e("button", {
            className: "px-3 py-1 bg-green-600 text-white rounded",
            onClick: addNote,
          }, "Add")
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
